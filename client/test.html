<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queen of Spades - WebSocket Protocol Test</title>
  <style>
    body { max-width: 1000px; margin: 24px auto; padding: 0 16px; font: 16px system-ui, sans-serif; }
    section { border: 1px solid #bbb; border-radius: 8px; margin: 16px 0; padding: 16px; }
    label { display: inline-grid; gap: 4px; margin: 4px 10px 4px 0; }
    input, select, button { font: inherit; padding: 6px 9px; }
    button { cursor: pointer; margin: 4px; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #hand button { min-width: 48px; }
    #log { max-height: 240px; overflow: auto; background: #f4f4f4; padding: 12px; font: 13px ui-monospace, monospace; }
    pre { overflow: auto; background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <h1>Queen of Spades — JSON WebSocket test</h1>
  <p>Manual client for protocol <code>qos.v1</code>. Start the local Worker and Vite app, then use this page at <code>/test.html</code>.</p>

  <section>
    <h2>Connect to a room</h2>
    <label>Worker URL <input id="apiUrl" value="http://localhost:8787"></label>
    <label>Player name <input id="playerName" value="Test Player" maxlength="24"></label>
    <label>Room code <input id="roomCode" maxlength="6" autocapitalize="characters"></label>
    <div>
      <button id="create">Create room</button>
      <button id="join">Join room</button>
      <button id="resume">Resume saved session</button>
      <button id="leave" disabled>Leave</button>
    </div>
    <p>Status: <strong id="status">Not connected</strong> · Player ID: <code id="playerId">—</code></p>
  </section>

  <section>
    <h2>Game actions</h2>
    <button id="start" disabled>Start deal</button>
    <label>Bid <input id="bid" type="number" min="75" max="150" step="5" value="80"></label>
    <button id="placeBid" disabled>Bid</button>
    <button id="pass" disabled>Pass</button>
    <label>Partner calls (JSON) <input id="partnerCalls" value="[]"></label>
    <label>Cut suit
      <select id="cutSuit">
        <option value="spades">Spades</option><option value="hearts">Hearts</option>
        <option value="diamonds">Diamonds</option><option value="clubs">Clubs</option>
      </select>
    </label>
    <button id="setContract" disabled>Set contract</button>
    <button id="nextDeal" disabled>Next deal</button>
  </section>

  <section>
    <h2>Players & scores</h2>
    <div id="players"></div>
    <pre id="state">No game state</pre>
    <h3>Your hand</h3>
    <div id="hand"></div>
    <h3>Current round</h3>
    <div id="round"></div>
  </section>

  <section>
    <h2>Message log</h2>
    <div id="log" aria-live="polite"></div>
  </section>

  <script type="module">
    const VERSION = 1;
    const RESUME_KEY = 'queen-of-spades:resume-session';
    const $ = id => document.getElementById(id);
    const pending = new Map();
    let webSocket;
    let gameState;
    let player = null;
    let hand = [];

    const log = message => {
      const row = document.createElement('div');
      row.textContent = `${new Date().toLocaleTimeString()} ${message}`;
      $('log').prepend(row);
    };

    const apiBase = () => $('apiUrl').value.trim().replace(/\/+$/, '');
    const gameCode = () => $('roomCode').value.trim().toUpperCase();
    const wsUrl = code => {
      const url = new URL(apiBase());
      url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
      url.pathname = `/ws/${encodeURIComponent(code)}`;
      url.search = '';
      return url.toString();
    };

    function connect(code) {
      if (webSocket?.readyState === WebSocket.OPEN && $('roomCode').value.toUpperCase() === code) {
        return Promise.resolve();
      }
      webSocket?.close();
      return new Promise((resolve, reject) => {
        const current = new WebSocket(wsUrl(code), ['qos.v1']);
        webSocket = current;
        current.addEventListener('open', () => {
          if (current.protocol !== 'qos.v1') {
            current.close();
            reject(new Error('Server did not negotiate qos.v1'));
            return;
          }
          $('status').textContent = `Connected to ${code}`;
          $('leave').disabled = false;
          resolve();
        }, { once: true });
        current.addEventListener('error', () => reject(new Error('Could not connect to the Worker')),
          { once: true });
        current.addEventListener('close', () => {
          if (webSocket === current) {
            $('status').textContent = 'Disconnected';
            $('leave').disabled = true;
            for (const [id, request] of pending) {
              pending.delete(id);
              request.reject(new Error('WebSocket disconnected'));
            }
          }
        });
        current.addEventListener('message', event => receive(JSON.parse(event.data)));
      });
    }

    function request(type, payload = {}) {
      if (webSocket?.readyState !== WebSocket.OPEN) return Promise.reject(new Error('Connect to a room first'));
      const requestId = crypto.randomUUID();
      return new Promise((resolve, reject) => {
        pending.set(requestId, { resolve, reject });
        webSocket.send(JSON.stringify({ v: VERSION, type, requestId, payload }));
      });
    }

    function receive(message) {
      if (message.v !== VERSION) return log('Unsupported protocol version in server message');
      if (message.type === 'response') {
        const request = pending.get(message.requestId);
        if (!request) return;
        pending.delete(message.requestId);
        if (message.ok) request.resolve(message.payload || {});
        else request.reject(Object.assign(new Error(message.error.message), { code: message.error.code }));
      } else if (message.type === 'event') {
        handleEvent(message.event, message.payload || {});
      }
    }

    function handleEvent(event, data) {
      log(`← ${event}`);
      if (event === 'game.playerState') {
        hand = data.hand || [];
        player ||= { id: data.currentPlayerId };
      } else if (event === 'game.cardPlayed') {
        gameState = {
          ...gameState,
          currentPlayer: data.nextPlayer,
          scores: data.scores,
          matchScores: data.matchScores,
          dealNumber: data.dealNumber
        };
        gameState.currentRound = [...(gameState.currentRound || []), data.play];
        if (data.play.playerId === player?.id) {
          hand = hand.filter(card => card.suit !== data.play.card.suit || card.value !== data.play.card.value);
        }
      } else if (event === 'game.roundComplete') {
        gameState = { ...gameState, currentRound: [], scores: data.scores, lastRound: data.lastRound };
      } else if (event === 'game.over') {
        gameState = { ...gameState, ...data, status: 'finished' };
      } else if (data.gameState) {
        gameState = data.gameState;
      }
      if (data.players) gameState = { ...gameState, players: data.players };
      render();
    }

    function saveSession(result) {
      player = result.player;
      gameState = result.gameState;
      hand = result.hand || [];
      $('roomCode').value = result.gameCode;
      localStorage.setItem(RESUME_KEY, JSON.stringify({
        gameCode: result.gameCode,
        playerId: result.player.id,
        resumeToken: result.player.resumeToken
      }));
      render();
    }

    async function createRoom() {
      try {
        const response = await fetch(`${apiBase()}/api/rooms`, { method: 'POST' });
        const allocation = await response.json();
        if (!response.ok || !allocation.success) throw new Error(allocation.message || 'Room allocation failed');
        await connect(allocation.gameCode);
        const result = await request('game.create', { playerName: $('playerName').value.trim() });
        saveSession(result);
        log(`Created room ${result.gameCode}`);
      } catch (error) { log(`Create failed: ${error.message}`); }
    }

    async function joinRoom() {
      try {
        const code = gameCode();
        await connect(code);
        const result = await request('game.join', { playerName: $('playerName').value.trim() });
        saveSession(result);
        log(`Joined room ${result.gameCode}`);
      } catch (error) { log(`Join failed: ${error.message}`); }
    }

    async function resumeSession() {
      try {
        const session = JSON.parse(localStorage.getItem(RESUME_KEY) || 'null');
        if (!session) throw new Error('No saved session');
        $('roomCode').value = session.gameCode;
        await connect(session.gameCode);
        const result = await request('game.resume', {
          playerId: session.playerId,
          resumeToken: session.resumeToken
        });
        player = { id: result.playerId };
        hand = result.hand;
        gameState = result.gameState;
        render();
        log(`Resumed player ${result.playerId}`);
      } catch (error) { log(`Resume failed: ${error.message}`); }
    }

    function render() {
      $('playerId').textContent = player?.id || '—';
      $('state').textContent = gameState ? JSON.stringify(gameState, null, 2) : 'No game state';
      $('players').textContent = gameState?.players?.map(item =>
        `${item.name}${item.id === player?.id ? ' (you)' : ''}: deal ${gameState.scores?.[item.id] || 0}, match ${gameState.matchScores?.[item.id] || 0}`
      ).join(' · ') || 'No players';
      $('round').textContent = gameState?.currentRound?.map(play =>
        `${play.playerId}: ${play.card.value} ${play.card.suit}`
      ).join(' · ') || 'No cards played this round';
      $('hand').replaceChildren(...hand.map(card => {
        const button = document.createElement('button');
        button.textContent = `${card.value} ${card.suit}`;
        button.disabled = !player?.id || gameState?.currentPlayer !== player.id;
        button.addEventListener('click', async () => {
          try { await request('game.playCard', { card }); }
          catch (error) { log(`Play failed: ${error.message}`); }
        });
        return button;
      }));
      const inRoom = Boolean(player?.id && webSocket?.readyState === WebSocket.OPEN);
      const isHost = gameState?.players?.[0]?.id === player?.id;
      $('start').disabled = !inRoom || !isHost || gameState?.status !== 'waiting' || gameState.players.length < 2;
      $('placeBid').disabled = !inRoom || gameState?.status !== 'bidding' || gameState.currentPlayer !== player?.id;
      $('pass').disabled = $('placeBid').disabled;
      $('setContract').disabled = !inRoom || gameState?.status !== 'contract' || gameState.currentPlayer !== player?.id;
      $('nextDeal').disabled = !inRoom || !isHost || gameState?.status !== 'finished';
    }

    $('create').addEventListener('click', createRoom);
    $('join').addEventListener('click', joinRoom);
    $('resume').addEventListener('click', resumeSession);
    $('start').addEventListener('click', async () => {
      try { await request('game.start'); } catch (error) { log(`Start failed: ${error.message}`); }
    });
    $('placeBid').addEventListener('click', async () => {
      try { await request('game.bid', { amount: Number($('bid').value) }); }
      catch (error) { log(`Bid failed: ${error.message}`); }
    });
    $('pass').addEventListener('click', async () => {
      try { await request('game.pass'); } catch (error) { log(`Pass failed: ${error.message}`); }
    });
    $('setContract').addEventListener('click', async () => {
      try {
        await request('game.setContract', {
          partnerCalls: JSON.parse($('partnerCalls').value),
          cutSuit: $('cutSuit').value
        });
      } catch (error) { log(`Contract failed: ${error.message}`); }
    });
    $('nextDeal').addEventListener('click', async () => {
      try { await request('game.nextDeal'); } catch (error) { log(`Next deal failed: ${error.message}`); }
    });
    $('leave').addEventListener('click', async () => {
      try { await request('game.leave'); } catch (error) { log(`Leave failed: ${error.message}`); }
      webSocket?.close();
      localStorage.removeItem(RESUME_KEY);
      player = null;
      gameState = null;
      hand = [];
      render();
    });

    render();
  </script>
</body>
</html>
